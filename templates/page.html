{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ site.title }}{% endblock %}

{% block content %}
<div class="static-page">
    <article class="post-content">
        <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
        </header>
        <div class="post-body prose">
            {{ content | safe }}
        </div>
    </article>
</div>
{% endblock %}
