[package]
name = "blog-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
katex = "0.4"
tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
syntect = "5"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
regex = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tiny_http = "0.12"
percent-encoding = "2"
notify = "7"
